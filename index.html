<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Sunshine ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

.scene {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================
   MUSIC BUTTON
========================= */

.music-button {
    position: fixed;
    top: 25px;
    right: 25px;
    z-index: 1000;

    width: 58px;
    height: 58px;

    border-radius: 50%;
    border: 1px solid #ff3333;

    background: rgba(20, 0, 0, 0.85);

    color: #ff3333;

    font-size: 25px;

    cursor: pointer;

    box-shadow:
        0 0 8px #ff0000,
        0 0 18px #700000;

    transition: 0.3s;
}

.music-button:hover {
    transform: scale(1.08);

    box-shadow:
        0 0 12px #ff0000,
        0 0 28px #900000;
}

.music-button.playing {
    animation: musicGlow 1.5s ease-in-out infinite;
}

@keyframes musicGlow {

    0%, 100% {
        box-shadow:
            0 0 8px #ff0000,
            0 0 18px #700000;
    }

    50% {
        box-shadow:
            0 0 15px #ff0000,
            0 0 32px #ff0000;
    }
}


/* =========================
   HEART
========================= */

.heart-container {
    position: absolute;
    width: 190px;
    height: 190px;
}

.heart-svg {
    width: 190px;
    height: 190px;
    overflow: visible;
}

.heart-path {
    fill: none;

    stroke: #ff0000;
    stroke-width: 3;

    stroke-linecap: round;
    stroke-linejoin: round;

    filter:
        drop-shadow(0 0 5px #ff0000)
        drop-shadow(0 0 12px #900000)
        drop-shadow(0 0 25px #500000);

    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;

    animation: drawHeart 4s linear forwards;
}

@keyframes drawHeart {

    to {
        stroke-dashoffset: 0;
    }
}


/* القلب ينبض بعد اكتمال الرسم */

.heart-container.heartbeat {
    animation: heartPulse 1.2s ease-in-out infinite;
}

@keyframes heartPulse {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }
}


/* =========================
   FIRST TEXT
========================= */

.first-text {
    position: absolute;

    top: 70%;

    width: 100%;

    text-align: center;

    color: white;

    font-size: 13px;

    font-style: italic;

    opacity: 0;
}

.line2 {
    margin-top: 25px;
}

.sunshine {

    margin-top: 32px;

    color: #ff3333;

    font-family: "Courier New", monospace;

    font-size: 16px;

    font-weight: bold;

    text-shadow:
        0 0 5px red,
        0 0 15px #900000,
        0 0 25px #500000;

    animation: sunshineGlow 1.5s infinite alternate;
}

@keyframes sunshineGlow {

    from {
        text-shadow:
            0 0 4px red,
            0 0 10px #700000;
    }

    to {
        text-shadow:
            0 0 8px red,
            0 0 22px red,
            0 0 35px #700000;
    }
}


/* =========================
   FINAL MESSAGE
========================= */

.final-message {

    position: absolute;

    width: 88%;

    max-width: 500px;

    text-align: center;

    opacity: 0;

    display: none;
}

.final-line1 {

    color: #ff4d4d;

    font-size: 17px;

    font-style: italic;

    margin-bottom: 22px;

    text-shadow:
        0 0 7px #700000;
}

.final-line2 {

    color: #ff7777;

    font-family: "Courier New", monospace;

    font-size: 13px;

    font-weight: bold;

    line-height: 1.8;

    margin-bottom: 22px;

    text-shadow:
        0 0 7px #700000;
}

.final-line3 {

    color: #ff7777;

    font-family: Arial, sans-serif;

    font-size: 13px;

    font-style: italic;

    line-height: 1.8;

    text-shadow:
        0 0 7px #700000;
}


/* ظهور الرسالة */

.show-final {

    display: block;

    animation: finalAppear 1s ease forwards;
}

@keyframes finalAppear {

    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* نبض خفيف للرسالة */

.gentle-pulse {

    animation:
        gentlePulse 2.5s ease-in-out infinite;
}

@keyframes gentlePulse {

    0%, 100% {

        transform: scale(1);

        text-shadow:
            0 0 5px #700000;
    }

    50% {

        transform: scale(1.025);

        text-shadow:
            0 0 9px #ff3333,
            0 0 18px #700000;
    }
}

</style>
</head>


<body>


<!-- =========================
     MUSIC
========================= -->

<audio id="backgroundMusic" loop>

    <source src="music.mp3" type="audio/mpeg">

</audio>


<!-- زر الموسيقى -->

<button
    class="music-button"
    id="musicButton"
    aria-label="Play music">

    🎵

</button>



<div class="scene">


    <!-- =========================
         HEART
    ========================= -->

    <div
        class="heart-container"
        id="heartContainer">

        <svg
            class="heart-svg"
            viewBox="0 0 200 200">

            <path
                class="heart-path"
                d="
                M100 170
                C85 155 30 120 30 70
                C30 35 70 25 100 55
                C130 25 170 35 170 70
                C170 120 115 155 100 170
                Z
                "
            />

        </svg>

    </div>



    <!-- =========================
         FIRST TEXT
    ========================= -->

    <div
        class="first-text"
        id="firstText">

        <div>
            Somewhere between all my thoughts,
        </div>

        <div class="line2">
            there's always you.
        </div>

        <div class="sunshine">
            my sunshine
        </div>

    </div>



    <!-- =========================
         FINAL MESSAGE
    ========================= -->

    <div
        class="final-message"
        id="finalMessage">

        <div
            class="final-line1"
            id="line1">
        </div>

        <div
            class="final-line2"
            id="line2">
        </div>

        <div
            class="final-line3"
            id="line3">
        </div>

    </div>

</div>



<script>


/* =========================
   MUSIC BUTTON
========================= */

const music =
    document.getElementById("backgroundMusic");

const musicButton =
    document.getElementById("musicButton");


musicButton.addEventListener("click", () => {

    if (music.paused) {

        music.play();

        musicButton.textContent = "🔊";

        musicButton.classList.add("playing");

    } else {

        music.pause();

        musicButton.textContent = "🎵";

        musicButton.classList.remove("playing");

    }

});



/* =========================
   ELEMENTS
========================= */

const heartContainer =
    document.getElementById("heartContainer");

const firstText =
    document.getElementById("firstText");

const finalMessage =
    document.getElementById("finalMessage");

const line1 =
    document.getElementById("line1");

const line2 =
    document.getElementById("line2");

const line3 =
    document.getElementById("line3");



/* =========================
   HEART
========================= */

setTimeout(() => {

    heartContainer.classList.add("heartbeat");

}, 4000);



/* =========================
   FIRST TEXT
========================= */

setTimeout(() => {

    firstText.style.transition =
        "opacity 1.5s ease";

    firstText.style.opacity = "1";

}, 4300);



/* =========================
   FADE OUT
========================= */

setTimeout(() => {

    heartContainer.style.transition =
        "opacity 1s ease";

    firstText.style.transition =
        "opacity 1s ease";

    heartContainer.style.opacity = "0";

    firstText.style.opacity = "0";

}, 8500);



/* =========================
   FINAL MESSAGE
========================= */

setTimeout(() => {

    heartContainer.style.display = "none";

    firstText.style.display = "none";


    finalMessage.classList.add(
        "show-final"
    );


    typeText(
        "Tomorrow is your first day...",
        line1,
        0,
        () => {

            typeText(
                "and I just want you to know that I believe in you.",
                line2,
                0,
                () => {

                    typeText(
                        "Go make it yours, my sunshine. ❤️",
                        line3,
                        0,
                        () => {

                            finalMessage.classList.add(
                                "gentle-pulse"
                            );

                        }
                    );

                }
            );

        }
    );

}, 9500);



/* =========================
   TYPEWRITER
========================= */

function typeText(
    text,
    element,
    index,
    callback
) {

    if (index < text.length) {

        element.textContent +=
            text.charAt(index);

        setTimeout(() => {

            typeText(
                text,
                element,
                index + 1,
                callback
            );

        }, 70);

    } else {

        if (callback) {

            setTimeout(
                callback,
                300
            );

        }

    }

}

</script>

</body>
</html>
